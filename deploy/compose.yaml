# Compose do Rastru: SQL Server Express, a API (com o SPA dentro da imagem) e o Caddy na frente.
# Os segredos ficam em arquivos .env fora do repositório, em ${RASTRU_SEGREDOS:-.} (ver deploy/exemplos/).
# A imagem vem por variável e nunca tem tag latest: sem RASTRU_IMAGEM o Compose se recusa a rodar.
name: rastru-deploy

networks:
  rastru:
    ipam:
      config:
        # Sub-rede fixa: é a única rede em que a API confia para ler o X-Forwarded-For (ProxyReverso__Rede).
        - subnet: 172.30.0.0/24

volumes:
  mssql:
  caddy_data:
  caddy_config:

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "2048"
    env_file:
      - ${RASTRU_SEGREDOS:-.}/sqlserver.env
    volumes:
      - mssql:/var/opt/mssql
    # Sem "ports": a 1433 não sai da rede do Compose.
    networks: [rastru]
    healthcheck:
      # A senha vai por SQLCMDPASSWORD, que o sqlcmd lê: no "-P" ela ficaria na linha de comando, legível por ps.
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api-hml:
    image: ${RASTRU_IMAGEM:?defina RASTRU_IMAGEM}
    restart: unless-stopped
    env_file:
      - ${RASTRU_SEGREDOS:-.}/hml.env
    environment:
      # A rede descrita na chave "networks" acima: só ela é confiável para o X-Forwarded-For.
      ProxyReverso__Rede: 172.30.0.0/24
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [rastru]

  # Prepara o banco da HML (cria, migra, garante o login). Roda sob demanda: docker compose run --rm banco-hml
  banco-hml:
    image: ${RASTRU_IMAGEM:?defina RASTRU_IMAGEM}
    profiles: [ferramentas]
    env_file:
      - ${RASTRU_SEGREDOS:-.}/hml.env
      - ${RASTRU_SEGREDOS:-.}/banco-hml.env
    command: ["banco", "preparar"]
    depends_on:
      sqlserver:
        condition: service_healthy
    networks: [rastru]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      RASTRU_DOMINIO_HML: ${RASTRU_DOMINIO_HML:?defina RASTRU_DOMINIO_HML}
    ports:
      - "${RASTRU_PORTA_HTTP:-80}:80"
      - "${RASTRU_PORTA_HTTPS:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # O certificado e a conta ficam no volume: não se pede de novo a cada deploy.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-hml
    networks: [rastru]
